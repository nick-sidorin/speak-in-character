name: Windows build

# Builds are deliberately manual while iterating, to avoid noisy failed-build emails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows x64 app
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows push-to-talk helper
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe"
          if (-not (Test-Path $compiler)) { throw "C# compiler not found: $compiler" }
          & $compiler /nologo /optimize+ /target:exe /out:native\\hotkey.exe native\\hotkey.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate and package
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: InCharacter-Windows
          path: release/win-unpacked/**
          if-no-files-found: error
          retention-days: 30
