name: Publish stable Windows release

# A matching tag on main builds and publishes its own verified artifact.
# For retries, dispatch this workflow with the existing tag as its ref.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate stable tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match tag, package version, main ancestry and notes
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/* ]] || { echo "Select an existing release tag, not a branch"; exit 1; }
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable release tag"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [[ "$tag" == "v$version" ]] || { echo "Tag/package version mismatch"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$tag^{commit}")" ]] || { echo "Checkout/tag mismatch"; exit 1; }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo "Release commit must be in main"; exit 1; }
          test -s ".github/release-notes/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Verify tagged Windows build
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish stable ZIP and checksum
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Retrieve this run's verified Windows application
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --name SpeakInCharacter-PR-Windows --dir staging
      - name: Make portable ZIP and SHA-256 checksum
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.tag }}
        run: bash scripts/package-windows-release.sh
      - name: Upload draft assets, then publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(node -p "JSON.parse(require('fs').readFileSync('release-state.json','utf8')).isDraft")" != true ]]; then
              echo "Release is already published; leaving its assets unchanged"
              gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json url --jq .url
              exit 0
            fi
            gh release upload "$VERSION" "$ARCHIVE" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "$ARCHIVE" SHA256SUMS.txt \
              -R "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "SpeakInCharacter ${VERSION#v}" \
              --notes-file ".github/release-notes/$VERSION.md"
          fi
          gh release edit "$VERSION" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json url,assets
